<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111214">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="detail.css">
  <link rel="stylesheet" href="prs.css">
  <link rel="stylesheet" href="rm.css">
  <link rel="stylesheet" href="plate-spacing.css">
  <title>Forge</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><h1 id="page-title">Mes performances</h1></div>
    </header>
    <main id="app-content"></main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-item active" data-view="prs"><span class="nav-icon">↗</span><span>PRs</span></button>
      <button class="nav-item" data-view="fit"><span class="nav-icon">◌</span><span>Fit level</span></button>
      <button class="nav-add" id="open-form" aria-label="Ajouter une performance">+</button>
      <button class="nav-item" data-view="general"><span class="nav-icon">◒</span><span>Général</span></button>
      <button class="nav-item" data-view="profile"><span class="nav-icon">●</span><span>Profil</span></button>
    </nav>
  </div>
  <dialog id="performance-dialog"><form method="dialog" id="performance-form">
    <div class="dialog-head"><div><p class="eyebrow">NOUVELLE DONNÉE</p><h2>Ajouter une performance</h2></div><button type="button" id="close-performance-dialog" class="close-button" aria-label="Fermer">×</button></div>
    <label>Exercice<select id="exercise-input" required></select></label>
    <label>Valeur<input id="value-input" type="number" min="0" step="0.5" placeholder="Ex. 90" required></label>
    <label>Type de performance<select id="rm-input">
      <option value="1">1RM — 1 répétition maximale</option>
      <option value="2">2RM — 2 répétitions maximales</option>
      <option value="3">3RM — 3 répétitions maximales</option>
      <option value="5">5RM — 5 répétitions maximales</option>
      <option value="8">8RM — 8 répétitions maximales</option>
    </select></label>
    <label>Unité<select id="unit-input"><option>kg</option><option>rep</option><option>m</option><option>min</option></select></label>
    <label>Joindre une photo / vidéo <span class="optional-label">(facultatif)</span><input id="media-input" type="file" accept="image/*,video/*"></label>
    <label>Date<input id="date-input" type="date" required></label>
    <button class="primary-button" value="default">Enregistrer la performance</button>
  </form></dialog>
  <dialog id="plates-dialog"></dialog>
  <dialog id="exercise-info-dialog"></dialog>
  <script src="app.js"></script>
</body>
</html>
